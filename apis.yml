aid: farther
name: Farther
description: >-
  Farther is a technology-driven wealth management and registered investment
  advisory (RIA) firm that pairs human financial advisors with a proprietary
  "Intelligent Wealth Platform." The firm has recruited more than $23 billion in
  client assets and positions itself among the fastest-growing US financial
  services firms (Inc. Magazine, Deloitte Technology Fast 500). Services span
  financial and retirement planning, investment and portfolio management,
  tax-intelligent optimization, trust and estate planning, generational wealth,
  small-business services, Farther Asset Management, and institutional offerings.
  The client experience runs through a single-page web/mobile application at
  app.farther.com and integrates account aggregation via Plaid. Farther does not
  publish a public developer API, OpenAPI/AsyncAPI specification, SDKs, or a
  developer portal; this profile captures the firm's public web, security, and
  identity surface. Backed by Bessemer Venture Partners and Lightspeed Venture
  Partners.
